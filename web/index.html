<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice2QR</title>
<meta name="description" content="Put a real voice in a QR code" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic UI", system-ui, sans-serif;
    margin: 0 auto; max-width: 560px; padding: 20px 16px 28px; color: #4a3555;
    background:
      radial-gradient(circle, rgba(255,255,255,.55) 2.2px, transparent 2.6px) 0 0 / 26px 26px,
      linear-gradient(160deg, #ffd9ec 0%, #e6dcff 48%, #cdeffd 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  header { text-align: center; }
  header h1 {
    font-size: 36px; margin: 10px 0 0; letter-spacing: .04em; font-weight: 800;
    background: linear-gradient(90deg, #ff6fb5, #a06cd5 60%, #5db9e8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header h1::before { content: "♡ "; color: #ff8ac2; -webkit-text-fill-color: #ff8ac2; font-size: 24px; vertical-align: 6px; }
  header h1::after { content: " ✧"; color: #b18cff; -webkit-text-fill-color: #b18cff; font-size: 24px; vertical-align: 6px; }
  header p { margin: 6px 0 14px; color: #9a7bb8; font-weight: 700; letter-spacing: .08em; }
  nav.tabs {
    display: flex; gap: 6px; margin: 14px 0; padding: 5px;
    background: rgba(255,255,255,.65); border: 2px solid #fff; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(214, 141, 196, .25);
  }
  nav.tabs button {
    flex: 1; padding: 10px; font-size: 16px; font-weight: 700; font-family: inherit;
    border: none; background: transparent; color: #a06cb8; border-radius: 999px; cursor: pointer;
    transition: all .18s ease;
  }
  nav.tabs button.active {
    background: linear-gradient(90deg, #ff8ac2, #b18cff); color: #fff;
    box-shadow: 0 4px 12px rgba(255, 138, 194, .5);
  }
  section.view {
    display: none; background: rgba(255,255,255,.78); border: 2px solid #fff; border-radius: 26px;
    padding: 18px; box-shadow: 0 12px 28px rgba(176, 141, 214, .22);
  }
  section.view.active { display: block; }
  button.action {
    padding: 10px 18px; font-size: 15px; font-weight: 700; font-family: inherit;
    border-radius: 999px; border: 2px solid #ffc7e3; background: #fff; color: #d63384;
    cursor: pointer; box-shadow: 0 4px 10px rgba(255, 138, 194, .22);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button.action:hover { transform: translateY(-1px); }
  button.action:active { transform: scale(.97); }
  button.action.primary {
    background: linear-gradient(90deg, #ff7eb9, #a06cd5); border: none; color: #fff;
    font-size: 18px; padding: 14px 26px; box-shadow: 0 8px 18px rgba(255, 126, 185, .45);
  }
  button.action.primary.recording { animation: recpulse 1.2s ease-in-out infinite; }
  @keyframes recpulse {
    0%, 100% { box-shadow: 0 8px 18px rgba(255, 126, 185, .45), 0 0 0 0 rgba(255, 126, 185, .45); }
    50% { box-shadow: 0 8px 18px rgba(255, 126, 185, .45), 0 0 0 12px rgba(255, 126, 185, 0); }
  }
  button.action:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  progress { width: 100%; height: 16px; appearance: none; -webkit-appearance: none; }
  progress::-webkit-progress-bar { background: #ffe0ef; border-radius: 999px; }
  progress::-webkit-progress-value { background: linear-gradient(90deg, #ff8ac2, #b18cff); border-radius: 999px; }
  progress::-moz-progress-bar { background: linear-gradient(90deg, #ff8ac2, #b18cff); border-radius: 999px; }
  .status { min-height: 1.4em; color: #8a6db3; font-weight: 600; }
  .error { color: #e5487f; font-weight: 700; }
  canvas#qr {
    image-rendering: pixelated; background: #fff; border: 3px dashed #ff9ecf; border-radius: 20px;
    padding: 10px; max-width: 100%; height: auto; box-shadow: 0 8px 18px rgba(214, 141, 196, .25);
    cursor: pointer;
  }
  #qr-modal {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 20px;
    background: rgba(74, 53, 85, .55);
  }
  #qr-modal[hidden] { display: none; }
  canvas#qr-big {
    image-rendering: pixelated; background: #fff; border-radius: 20px; padding: 12px;
    max-width: 92vw; max-height: 76vh; width: auto; height: auto;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
  }
  #qr-modal .row { justify-content: center; }
  video#camera { width: 100%; border-radius: 20px; background: #000; border: 3px solid #fff; box-shadow: 0 8px 18px rgba(176, 141, 214, .3); }
  .drop-zone {
    border: 3px dashed #ff9ecf; border-radius: 20px; background: rgba(255,255,255,.65);
    padding: 26px 12px; text-align: center; color: #a06cb8; cursor: pointer; margin-bottom: 12px;
  }
  .drop-zone.dragover { background: #ffeef7; border-color: #ff7eb9; }
  .paste-box {
    border: 2px dashed #ffc7e3; border-radius: 14px; min-height: 56px;
    background: rgba(255,255,255,.5); padding: 6px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #a06cb8; cursor: text;
  }
  .paste-box:empty::before {
    content: attr(data-placeholder);
    color: #c39bd8; pointer-events: none;
  }
  .paste-box img { max-width: 100%; }
  input[type="file"] { font-family: inherit; font-size: 14px; color: #8a6db3; max-width: 100%; }
  input[type="file"]::file-selector-button {
    font-family: inherit; font-weight: 700; font-size: 14px; color: #d63384;
    background: #fff; border: 2px solid #ffc7e3; border-radius: 999px; padding: 7px 14px;
    margin-right: 8px; cursor: pointer; box-shadow: 0 3px 8px rgba(255, 138, 194, .2);
  }
  details.settings {
    margin: 18px 0; background: rgba(255,255,255,.65); border: 2px solid #fff; border-radius: 22px;
    padding: 12px 16px; box-shadow: 0 8px 20px rgba(176, 141, 214, .18);
  }
  details.settings summary { font-weight: 800; color: #a06cd5; cursor: pointer; letter-spacing: .06em; }
  details.settings label { display: block; margin: 10px 0; font-size: 14px; font-weight: 600; color: #6b5583; }
  details.settings select {
    font-size: 14px; font-family: inherit; font-weight: 600; color: #6b5583;
    padding: 6px 12px; margin-left: 8px; border: 2px solid #ffd0e8; border-radius: 999px; background: #fff;
  }
  footer { margin-top: 22px; color: #a58cc4; font-size: 13px; text-align: center; font-weight: 600; }
  #print-area { display: none; }
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    #print-area img { display: block; }
  }
</style>
</head>
<body>
<header>
  <h1>Voice2QR</h1>
  <p data-i18n="tagline">声を QR コードに入れる</p>
</header>

<nav class="tabs">
  <button id="tab-create" class="active" type="button" data-i18n="tabCreate">つくる</button>
  <button id="tab-read" type="button" data-i18n="tabRead">よむ</button>
</nav>

<section id="view-create" class="view active">
  <div class="row">
    <button id="btn-record" class="action primary" type="button" data-i18n="record">● 録音する</button>
    <span id="rec-status" class="status"></span>
  </div>
  <progress id="rec-progress" value="0" max="100"></progress>
  <div class="row">
    <span data-i18n="importLabel">または音声ファイルから</span>
    <input id="file-audio" type="file" accept="audio/*" />
  </div>
  <div id="create-result" hidden>
    <canvas id="qr"></canvas>
    <div class="row"><span id="result-info" class="status"></span></div>
    <div class="row">
      <button id="btn-share" class="action" type="button" data-i18n="share">共有</button>
      <button id="btn-save" class="action" type="button" data-i18n="savePng">PNG を保存</button>
      <button id="btn-print" class="action" type="button" data-i18n="print">印刷</button>
      <button id="btn-preview" class="action" type="button" data-i18n="play">再生</button>
    </div>
  </div>
  <div id="create-error" class="status error"></div>
</section>

<section id="view-read" class="view">
  <div id="drop-zone" class="drop-zone" role="button" tabindex="0">
    <span data-i18n="dropImage">QR 画像をドロップ、またはクリックで選択</span>
    <input id="file-image" type="file" accept="image/*" hidden />
  </div>
  <div id="paste-box" class="paste-box" contenteditable="true" data-i18n-placeholder="paste"></div>
  <div class="row">
    <button id="btn-camera" class="action" type="button" data-i18n="cameraStart">カメラで読む</button>
    <span id="read-status" class="status"></span>
  </div>
  <video id="camera" autoplay playsinline muted hidden></video>
  <div id="read-result" hidden>
    <div class="row"><span id="read-info" class="status"></span></div>
    <div class="row">
      <button id="btn-play" class="action" type="button" data-i18n="play">再生</button>
    </div>
  </div>
  <div id="read-error" class="status error"></div>
</section>

<details class="settings">
  <summary data-i18n="settings">設定</summary>
  <label><span data-i18n="language">言語</span>
    <select id="sel-lang">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </label>
  <label><span data-i18n="bps">ビットレート（上級者向け）</span>
    <select id="sel-bps">
      <option value="3200">3200 bps</option>
      <option value="2400">2400 bps</option>
      <option value="1600">1600 bps</option>
      <option value="1400">1400 bps</option>
      <option value="1300">1300 bps</option>
      <option value="1200" selected>1200 bps</option>
      <option value="700">700C bps</option>
    </select>
  </label>
  <label><span data-i18n="ecLevel">誤り訂正（上級者向け）</span>
    <select id="sel-ec">
      <option value="L">L</option>
      <option value="M" selected>M</option>
      <option value="Q">Q</option>
      <option value="H">H</option>
    </select>
  </label>
</details>

<footer data-i18n="footer">処理はすべてこの端末の中で行います。録音データは保存されません。</footer>

<div id="qr-modal" hidden>
  <canvas id="qr-big"></canvas>
  <div class="row">
    <button id="btn-modal-share" class="action" type="button" data-i18n="share">共有</button>
    <button id="btn-modal-close" class="action" type="button" data-i18n="close">閉じる</button>
  </div>
</div>

<div id="print-area"><img id="print-qr" alt="" /></div>

<script type="module" src="./app/main.ts"></script>
</body>
</html>
